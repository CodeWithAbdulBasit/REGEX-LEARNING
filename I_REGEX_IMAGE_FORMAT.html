<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGEX IMAGE FORMAT - STEP 15</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .is-Invalid{
            border: 2px solid red;
            background-color: #ffb1b14d;
        }
        .is-Valid{
            border: 2px solid green;
        }
        .error-message{
            color: red;
            background-color: #ffb1b1;
            padding: 3px 0px 3px 0px;
            font-weight: 900;
        }
    </style>

<body>
    <h1><b>REGEX IMAGE FORMAT - STEP 15</b></h1>
    <div class="container mt-5">
        <form id="myForm" novalidate>
            <div class="form-group">
                <label for="imageInput">Image</label>
                <input type="file" class="form-control" id="imageInput" placeholder="">
                <br />
                <span id="imageError" class="error-message"></span>
            </div>
            <br />
            <button type="submit" class="btn btn-primary" id="submitBtn">Submit</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>

        //SINGLE FILE INPUT
        // const fileRegex = /^[A-Za-z0-9_-]+\.(jpg|png|jpeg|gif)$/i;

        //     const error = document.getElementById("imageError");

        //         error.innerText = "";
        //         this.classList.remove("is-Invalid"); 
        //         this.classList.add("is-Valid");
        //     }
        // });
        //----------------------------------------------------------------
        //----------------------------------------------------------------
        const validationMessage = {
            ImageMsg:{
                message: "Only JPG, JPEG, PNG or GIF files are allowed."
            }
        }
        //----------------------------------------------------------------
        //----------------------------------------------------------------
        LiveValidate({
            input: document.getElementById("imageInput"),
            regex: /^[A-Za-z0-9_-]+\.(jpg|png|jpeg|gif)$/i,
            error: document.getElementById("imageError"),
            message: validationMessage.ImageMsg,
            type: "Image"
        });
        //----------------------------------------------------------------
        //MULTI FILE INPUT
        //----------------------------------------------------------------
        function LiveValidate({input, regex, error, message, type}){
            input.addEventListener("change", () => {
                if(type === "Image"){
                    const file = input.files[0];
                    if(!file) return;
                    const fileName = file.name;
                    if(!regex.test(fileName))
                    {
                        error.innerText = message.message,
                        input.classList.add("is-Invalid"),
                        input.classList.remove("is-Valid"),
                        input.value = ""
                    }
                    else
                    {
                        error.innerText = "",
                        input.classList.remove("is-Invalid"),
                        input.classList.add("is-Valid")
                    }
                }
            });
        }
        //----------------------------------------------------------------
    </script>
