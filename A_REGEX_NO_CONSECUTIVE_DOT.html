<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGEX VALIDATE NO CONSECUTIVE DOts - STEP 22</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .is-Invalid{
            border: 2px solid red;
            background-color: #ffb1b14d;
        }
        .is-Valid{
            border: 2px solid green;
        }
        .error-message{
            color: red;
            background-color: #ffb1b1;
            padding: 3px 0px 3px 0px;
            font-weight: 900;
        }
    </style>
</head>
<body>
    <h1><b>REGEX VALIDATE NO CONSECUTIVE DOts - STEP 22</b></h1>
    <div class="container mt-5">
        <form id="myForm" novalidate>
            <div class="form-group">
                <label for="emailInput">Email</label>
                <input type="text" class="form-control" id="emailInput" placeholder="Enter Email">
                <br />
                <span id="emailError" class="error-message"></span>
            </div>
            <br />
            <button type="submit" class="btn btn-primary" id="submitBtn">Submit</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        //----------------------------------------------------------------
        const validationMessage = {
           Email: {
                Emailmsg: "Email address is invalid.",
                Consecutivemsg: "Please remove consecutive dots (..) from the email."
            }
        };
        //----------------------------------------------------------------
        //----------------------------------------------------------------
        LiveValidate({
            input: document.getElementById("emailInput"),
            regex: /^(?!.*\.\.)[a-z0-9.]+\@[a-z]+\.[a-z]{3,6}$/i,
            error: document.getElementById("emailError"),
            message: validationMessage.Email,
            type: "Email"
        });
        //----------------------------------------------------------------
        //----------------------------------------------------------------
        function LiveValidate({input, regex, error, message, type}){
            const emailRegex = /^[a-z0-9.]+@[a-z]+\.[a-z]{3,6}$/i;
            const consecutiveDotRegex = /\.\./;
            input.addEventListener("input", () => {
                if(type === "Email"){
                    if (consecutiveDotRegex.test(input.value)) {
                        error.innerText = message.Consecutivemsg;
                        input.classList.add("is-Invalid");
                        input.classList.remove("is-Valid");
                    }
                    else if (!emailRegex.test(input.value)) {
                        error.innerText = message.Emailmsg;
                        input.classList.add("is-Invalid");
                        input.classList.remove("is-Valid");
                    }
                    else
                    {
                        error.innerText = "",
                        input.classList.remove("is-Invalid"),
                        input.classList.add("is-Valid")
                    }
                }
            });
        }
        //----------------------------------------------------------------
        //----------------------------------------------------------------
        document.getElementById("myForm").addEventListener("submit", function(e){
            e.preventDefault();
            const input = document.getElementById("emailInput");
            const error = document.getElementById("emailError");
            input.dispatchEvent(new Event("input"));
            if(input.classList.contains("is-Invalid") || input.value.trim() === ""){
                error.innerText = validationMessage.url.message;
                input.classList.add("is-Invalid");
                input.classList.remove("is-Valid");
                input.focus();
                return;
            }
            alert("FORM SUBMIT SUCCESSFULLY!");
        });
        //----------------------------------------------------------------
    </script>
</body>
</html>
