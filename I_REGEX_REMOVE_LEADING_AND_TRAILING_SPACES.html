<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGEX Remove leading / trailing spaces - STEP 18</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .is-Invalid{
            border: 2px solid red;
            background-color: #ffb1b14d;
        }
        .is-Valid{
            border: 2px solid green;
        }
        .error-message{
            color: red;
            background-color: #ffb1b1;
            padding: 3px 0px 3px 0px;
            font-weight: 900;
        }
    </style>
</head>
<body>
    <h1><b>REGEX Remove leading / trailing spaces - STEP 18</b></h1>
    <div class="container mt-5">
        <form id="myForm" novalidate>
            <div class="form-group">
                <label for="input">Name</label>
                <input type="text" class="form-control" id="input" placeholder="Enter Name">
                <br />
                <span id="error" class="error-message"></span>
            </div>
            <br />
            <button type="submit" class="btn btn-primary" id="submitBtn">Submit</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        //----------------------------------------------------------------
        const validationMessage = {
             NoLeadingTrailingSpaces: {
                message: "Input cannot have leading or trailing spaces. Please remove extra spaces at the start or end."
            }
        };
        //----------------------------------------------------------------
        //----------------------------------------------------------------
        LiveValidate({
            input: document.getElementById("input"),
            regex: /^\s+|\s+$/i,
            error: document.getElementById("error"),
            message: validationMessage.NoLeadingTrailingSpaces,
            type: "Name"
        });
        //----------------------------------------------------------------
        //----------------------------------------------------------------
        function LiveValidate({input, regex, error, message, type}){
            input.addEventListener("input", () => {
                if(type === "Name"){
                    const trimmed = input.value.replace(regex, "");
                    if(input.value !== trimmed)
                    {
                        error.innerText = message.message,
                        input.classList.add("is-Invalid"),
                        input.classList.remove("is-Valid")
                    }
                    else
                    {
                        error.innerText = "",
                        input.classList.remove("is-Invalid"),
                        input.classList.add("is-Valid")
                    }
                }
            });
        }
        //----------------------------------------------------------------
        //----------------------------------------------------------------
        document.getElementById("myForm").addEventListener("submit", function(e){
            e.preventDefault();
            const input = document.getElementById("input");
            const error = document.getElementById("error");
            input.dispatchEvent(new Event("input"));
            if(input.classList.contains("is-Invalid") || input.value.trim() === ""){
                error.innerText = validationMessage.NoLeadingTrailingSpaces.message;
                input.classList.add("is-Invalid");
                input.classList.remove("is-Valid");
                input.focus();
                return;
            }
            alert("FORM SUBMIT SUCCESSFULLY!");
        });
        //----------------------------------------------------------------
    </script>
</body>
</html>
